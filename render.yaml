services:
  - type: web
    name: gyertai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # Значения задаются вручную в панели Render (секреты), а не в репозитории.
      - key: GROQ_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: VERIFY_BOT_TOKEN
        sync: false
      - key: XROCKET_API_TOKEN
        sync: false
      - key: XROCKET_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://gyertai.onrender.com
